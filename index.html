<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rekenkaarten op maat</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap">
<style>
:root{--bg:#faf7f2;--ink:#4a4038;--muted:#857a6f;--taupe:#a08f7e;--deep:#7a6a5b;--sand:#ece4da;--card:#fffdf9;--line:#e2d9ce;--serif:"Cormorant Garamond",Georgia,serif;--sans:"Jost",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a17;--ink:#efe8df;--muted:#b3a89c;--taupe:#b9a897;--deep:#cdbfb0;--sand:#2a2622;--card:#25211e;--line:#3a342e}}
:root[data-theme="dark"]{--bg:#1d1a17;--ink:#efe8df;--muted:#b3a89c;--taupe:#b9a897;--deep:#cdbfb0;--sand:#2a2622;--card:#25211e;--line:#3a342e}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;line-height:1.6}
.w{max-width:760px;margin:0 auto;padding:0 20px}
header{text-align:center;padding-top:36px}
.logo{display:inline-block;background:#faf7f2;border-radius:18px;padding:6px 18px}
.logo img{width:170px;max-width:60vw;display:block;mix-blend-mode:multiply}
.tag{font-family:var(--serif);font-size:clamp(1.6rem,5vw,2.3rem);font-weight:500;margin:18px 0 6px;color:var(--ink)}
.sub{color:var(--muted);margin:0 0 34px}
.stage{position:relative;width:min(340px,86vw);aspect-ratio:1/1;margin:0 auto}
.ghost{position:absolute;inset:0;border-radius:6px;background:var(--sand);box-shadow:0 6px 18px rgba(80,60,40,.12)}
.g1{transform:rotate(4deg) translate(6px,4px)}
.g2{transform:rotate(-3deg) translate(-5px,8px);background:var(--line)}
.note{position:absolute;inset:0;border:0;border-radius:6px;padding:26px 24px;text-align:left;cursor:pointer;color:#4a4038;font-family:var(--sans);font-weight:300;background:var(--nc,#efe4d6);box-shadow:0 12px 26px rgba(80,60,40,.2);transform:rotate(-1.5deg);transition:transform .28s ease,opacity .28s ease;display:flex;flex-direction:column}
.note::before{content:"";position:absolute;top:-10px;left:50%;width:70px;height:20px;margin-left:-35px;background:rgba(255,255,255,.55);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.note:hover{transform:rotate(-.5deg) translateY(-3px)}
.note:focus-visible{outline:2px solid var(--deep);outline-offset:4px}
.note.out{transform:translate(70px,-40px) rotate(12deg);opacity:0}
.note.in{animation:ni .35s ease}
@keyframes ni{from{transform:translateY(24px) rotate(-5deg);opacity:0}to{transform:rotate(-1.5deg);opacity:1}}
.num{font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;color:#7a6a5b}
.note h2{font-family:var(--serif);font-weight:600;font-size:1.9rem;line-height:1.1;margin:10px 0 12px}
.note p{margin:0;font-size:1.05rem;font-weight:400}
.tap{margin-top:auto;font-size:.9rem;color:#7a6a5b;font-weight:500}
.dots{display:flex;justify-content:center;gap:10px;margin:34px 0 8px}
.dots button{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:var(--line);cursor:pointer}
.dots button.on{background:var(--deep);transform:scale(1.3)}
#contact{padding:70px 0 40px}
#contact h2{font-family:var(--serif);font-weight:500;font-size:2.1rem;text-align:center;margin:0 0 6px}
#contact .sub{text-align:center;margin-bottom:26px}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;gap:14px}
label{display:grid;gap:5px;font-size:.9rem;color:var(--muted)}
input,textarea{font:inherit;font-weight:400;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px;width:100%}
input:focus,textarea:focus{outline:2px solid var(--taupe);outline-offset:1px}
textarea{min-height:120px;resize:vertical}
.btn{font:inherit;font-weight:500;letter-spacing:.06em;background:var(--taupe);color:#fff;border:0;border-radius:999px;padding:13px 28px;cursor:pointer;justify-self:center}
.btn:hover{background:var(--deep)}
#st{text-align:center;color:var(--deep);margin:0;min-height:1.4em}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:10px 0 40px}
@media (prefers-reduced-motion:reduce){.note,.note.in{transition:none;animation:none}}
</style>
</head>

<p class="tag">Rekenkaarten op maat</p>
<p class="sub">Voor scholen in het voortgezet onderwijs</p>
</header>

<main class="w">
<div class="stage">
<div class="ghost g2"></div><div class="ghost g1"></div>
<button class="note" id="note" aria-live="polite"><span class="num" id="nn"></span><h2 id="nt"></h2><p id="nx"></p><span class="tap" id="tp"></span></button>
</div>
<div class="dots" id="dots" aria-label="Kies een notitie"></div>

<section id="contact">
<h2>Laten we kennismaken</h2>
<p class="sub">Vertel kort over jullie school, dan denken we met je mee.</p>
<form id="f">
<label>Naam<input name="naam" required autocomplete="name"></label>
<label>School<input name="school" autocomplete="organization"></label>
<label>E-mailadres<input type="email" name="email" required autocomplete="email"></label>
<label>Bericht<textarea name="bericht" required></textarea></label>
<input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">
<button class="btn" type="submit">Verstuur</button>
<p id="st" role="status"></p>
</form>
</section>
</main>
<footer>© VA Studios</footer>

<script>
/* ===== HIER AANPASSEN ===== */
var CONFIG = { email: "vastudiosnl@gmail.com" };   // hier komen de berichten van het formulier binnen

// Voeg notities toe, wijzig of verwijder ze: { titel: "...", tekst: "..." }
var NOTES = [
  { titel: "Geen standaardkaart", tekst: "Een rekenkaart die past bij jouw school, niet uit de la." },
  { titel: "Samen gemaakt", tekst: "We ontwerpen hem in overleg met docenten van verschillende vakken op één school." },
  { titel: "Vakoverstijgend", tekst: "Eén kaart, één aanpak: leerlingen herkennen het rekenen in elk vak." },
  { titel: "Wat is anders?", tekst: "Standaard is voor iedereen. Deze is op maat en gedragen door je eigen docenten." },
  { titel: "Benieuwd?", tekst: "Neem contact op en ontdek wat een rekenkaart op maat voor jouw school kan betekenen." }
];
/* ========================== */

var COLORS = ["#efe4d6", "#e7dccf", "#f2eadf", "#e0d3c4", "#eadfd2"];
var i = 0, busy = false;
var note = document.getElementById("note"), dots = document.getElementById("dots");

NOTES.forEach(function (_, k) {
  var b = document.createElement("button");
  b.setAttribute("aria-label", "Notitie " + (k + 1));
  b.onclick = function () { go(k); };
  dots.appendChild(b);
});

function fill() {
  var n = NOTES[i];
  note.style.setProperty("--nc", COLORS[i % COLORS.length]);
  document.getElementById("nn").textContent = (i + 1) + " / " + NOTES.length;
  document.getElementById("nt").textContent = n.titel;
  document.getElementById("nx").textContent = n.tekst;
  document.getElementById("tp").textContent = i === NOTES.length - 1 ? "Naar het contactformulier ↓" : "Tik voor de volgende →";
  Array.prototype.forEach.call(dots.children, function (d, k) { d.classList.toggle("on", k === i); });
}
function go(k) {
  if (busy || k === i) return;
  busy = true; note.classList.add("out");
  setTimeout(function () {
    i = k; fill(); note.classList.remove("out"); note.classList.add("in");
    setTimeout(function () { note.classList.remove("in"); busy = false; }, 360);
  }, 280);
}
note.onclick = function () {
  if (i === NOTES.length - 1) { document.getElementById("contact").scrollIntoView(); return; }
  go(i + 1);
};
fill();

var FORM_URL = "https://formspree.io/f/xgavbryj";   // Formspree-adres

document.getElementById("f").onsubmit = function (e) {
  e.preventDefault();
  var form = e.target, st = document.getElementById("st"), btn = form.querySelector(".btn");
  var data = new FormData(form);
  data.append("_subject", "Nieuw bericht via de rekenkaarten-website");
  btn.disabled = true;
  st.textContent = "Bezig met versturen...";
  fetch(FORM_URL, { method: "POST", body: data, headers: { "Accept": "application/json" } })
    .then(function (r) {
      if (!r.ok) throw new Error("mislukt");
      form.reset();
      st.textContent = "Bedankt! Je bericht is verstuurd, we nemen snel contact op.";
    })
    .catch(function () {
      var body = "Naam: " + data.get("naam") + "\nSchool: " + data.get("school") + "\nE-mail: " + data.get("email") + "\n\n" + data.get("bericht");
      st.textContent = "Versturen lukte niet. Je mailprogramma opent nu; lukt dat ook niet, mail dan naar " + CONFIG.email + ".";
      window.location.href = "mailto:" + CONFIG.email + "?subject=" + encodeURIComponent("Vraag over rekenkaarten van " + data.get("naam")) + "&body=" + encodeURIComponent(body);
    })
    .then(function () { btn.disabled = false; });
};
</script>
</body>
</html>
